spring:
  application:
    name: Enterprise-Multi-Tenant-SaaS-POS-Application

  messages:
    basename: i18n/messages
    encoding: UTF-8

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:example.com}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.web: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.example.pos: DEBUG
